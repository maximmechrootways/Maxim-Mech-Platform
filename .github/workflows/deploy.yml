name: Deploy to Azure

on:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maxim-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: maxim-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Build
        run: npm run build

      - name: Push schema to production DB
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: maxim-backend/

  health-check:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for Azure to warm up
        run: sleep 30

      - name: Health check
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s https://maxim-backend-h8h4cjanhnhhhsgx.canadaeast-01.azurewebsites.net/health)
            echo "Attempt $i: $STATUS"
            if echo $STATUS | grep -q '"status":"ok"'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after 3 attempts - check Azure logs"