name: Deploy Frontend to Staging

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'maxim-frontend/**'
      - '.github/workflows/frontend-staging.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: maxim-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: maxim-frontend

      - name: Build Application
        run: npm run build
        working-directory: maxim-frontend
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}

      - name: Deploy to Staging
        # Replace with your provider: vercel-action, azure/static-web-apps-deploy, aws s3, etc.
        run: echo "Frontend built successfully. Configure deployment step with your staging host."
