name: maxim-mech-platform

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maxim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxim}
      POSTGRES_DB: ${POSTGRES_DB:-maxim}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - maxim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxim} -d ${POSTGRES_DB:-maxim}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./maxim-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      # Inside Docker the DB hostname is the compose service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-maxim}:${POSTGRES_PASSWORD:-maxim}@db:5432/${POSTGRES_DB:-maxim}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-maxim}:${POSTGRES_PASSWORD:-maxim}@db:5432/${POSTGRES_DB:-maxim}?schema=public
      PORT: 3000
      USE_LOCAL_BLOB_STORAGE: ${USE_LOCAL_BLOB_STORAGE:-false}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    volumes:
      - ./maxim-backend:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
    command: ["npm", "run", "dev"]

  frontend:
    build:
      context: ./maxim-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:3000
    volumes:
      - ./maxim-frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  maxim_pgdata:
  backend_node_modules:
  frontend_node_modules:
  backend_uploads:
